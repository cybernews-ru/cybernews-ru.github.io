<!DOCTYPE html>

<head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <nav class="nav" id="desktopNav">

        <a href="games.html" data-cat="Игры">Игры</a>
        <a href="zhelezo.html" data-cat="Железо">Железо</a>
        <a href="gadzhety.html" data-cat="Гаджеты">Гаджеты</a>

      </nav>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

      </div>
      <button class="burger" id="burger" aria-label="Меню">
        <span class="burger-line"></span>

  </header>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a class="active" data-cat="all" href="https://cybernews-ru.github.io/">Все</a>
    <a href="pc.html" data-cat="Компьютеры">Компьютеры</a>
    <a href="smartfony.html" data-cat="Смартфоны">Смартфоны</a>
    <a href="games.html" data-cat="Игры">Игры</a>
    <a href="zhelezo.html" data-cat="Железо">Железо</a>
    <a href="gadzhety.html" data-cat="Гаджеты">Гаджеты</a>
    <a href="soft.html" data-cat="Софт">Софт</a>
    <a href="tehnologii.html" data-cat="Технологии">Технологии</a>
    <a href="sluhi.html" data-cat="Слухи">Слухи</a>
    <div class="mobile-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Поиск новостей..." id="mobileSearchInput">
    </div>
  </div>

  <!-- BREADCRUMBS -->
  <div class="breadcrumbs">
    <a href="https://cybernews-ru.github.io/">Главная</a>
    <span>/</span>
    <a id="crumbCat" href="#">Категория</a>
    <span>/</span>
    <span id="crumbTitle">Статья</span>
  </div>

  <!-- ARTICLE -->
  <article class="article" id="articleContainer">
    <!-- Статья загрузится сюда автоматически -->
  </article>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-links">
      <a href="pc.html">Компьютеры</a>
      <a href="smartfony.html">Смартфоны</a>
      <a href="games.html">Игры</a>
      <a href="zhelezo.html">Железо</a>
      <a href="gadzhety.html">Гаджеты</a>
      <a href="soft.html">Софт</a>
      <a href="tehnologii.html">Технологии</a>
      <a href="sluhi.html">Слухи</a>
    </div>
    <p>Cyber &copy; 2026 — новости технологий. Все права защищены.</p>
  </footer>

  <script src="news-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.getElementById('burger');
      const mobileMenu = document.getElementById('mobileMenu');

      function closeMobileMenu() {
        burger.classList.remove('open');
        mobileMenu.classList.remove('open');
      }
      burger.addEventListener('click', () => {
        if (burger.classList.contains('open')) closeMobileMenu();
        else { burger.classList.add('open'); mobileMenu.classList.add('open'); }
      });
      document.addEventListener('click', (e) => {
        if (!burger.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
      });

      // ===== ПОЛУЧАЕМ ID СТАТЬИ ИЗ URL =====
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      const container = document.getElementById('articleContainer');
      const crumbCat = document.getElementById('crumbCat');
      const crumbTitle = document.getElementById('crumbTitle');

      // Проверяем, есть ли вообще ID
      if (!articleId) {
        container.innerHTML = '<div class="empty-state"><p>Статья не найдена.</p><p><a href="https://cybernews-ru.github.io/" style="color: var(--accent);">← Вернуться на главную</a></p></div>';
        return;
      }

      // Ищем статью в news-data.js
      // Статьи могут использовать id как число или как строку
      const article = news.find(n => String(n.id) === String(articleId));

      if (!article) {
        container.innerHTML = '<div class="empty-state"><p>Статья не найдена.</p><p><a href="https://cybernews-ru.github.io/" style="color: var(--accent);">← Вернуться на главную</a></p></div>';
        return;
      }

      // ===== ЗАГОЛОВОК СТРАНИЦЫ =====
      document.title = article.title + ' — Cyber';

      // ===== ХЛЕБНЫЕ КРОШКИ =====
      crumbCat.textContent = article.cat;
      crumbTitle.textContent = article.title;

      // ===== РЕНДЕР СТАТЬИ =====
      // Конвертируем Markdown в HTML
      const contentHtml = marked.parse(article.content || '');

      container.innerHTML = `
        <div class="article-header">
          <span class="article-badge">${article.cat}</span>
          <h1 class="article-title">${article.title}</h1>
          <div class="article-meta">
            <span>${article.date}</span>
            <span class="article-dot">•</span>
            <span>Cyber</span>
          </div>
        </div>
        <div class="article-cover">
          <img src="${article.img}" alt="${article.title}">
        </div>
        <div class="article-body" id="articleBody">
          ${contentHtml}
        </div>
      `;

      // ===== ОБРАБАТЫВАЕМ КАРТИНКИ ВНУТРИ СТАТЬИ =====
      // Каждая картинка из Markdown получает обёртку для красивого отображения
      const articleBody = document.getElementById('articleBody');
      articleBody.querySelectorAll('img').forEach(img => {
        const wrapper = document.createElement('figure');
        wrapper.className = 'article-image-inline';
        const caption = document.createElement('figcaption');
        caption.textContent = img.alt || '';
        img.parentNode.insertBefore(wrapper, img);
        wrapper.appendChild(img);
        if (img.alt) wrapper.appendChild(caption);
      });

      // Прокрутка наверх
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
